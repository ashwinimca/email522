विषय – 522 चयनित BELTRON प्रोग्रामरों की भूख हड़ताल एवं लंबित Joining शीघ्र सुनिश्चित कराने के संबंध में।

महोदय,

सविनय निवेदन है कि हम सभी 522 चयनित BELTRON प्रोग्रामर अभ्यर्थी अपनी ज्वाइनिंग की प्रतीक्षा कर रहे हैं। हमारी भर्ती का नोटिफिकेशन वर्ष 2024 में जारी हुआ था। अगस्त 2025 में परीक्षा हुई, जनवरी 2026 में परिणाम जारी हुआ तथा मार्च 2026 में Document Verification (DV) भी पूरा हो गया। इसके बावजूद अभी तक हमारी ज्वाइनिंग नहीं हो सकी है।

महोदय, अपनी ज्वाइनिंग से संबंधित समस्या को लेकर हम सभी अभ्यर्थी 10 से अधिक बार संबंधित अधिकारियों तथा BELTRON कार्यालय के अधिकारियों से मुलाकात कर चुके हैं। हर बार हमें ज्वाइनिंग की प्रक्रिया को लेकर आश्वासन मिला, लेकिन अभी तक हमारी ज्वाइनिंग नहीं हो पाई है।

अपनी ज्वाइनिंग की मांग को लेकर हम सभी ने 1 सितंबर से 5 सितंबर तक शांतिपूर्ण धरना-प्रदर्शन एवं भूख हड़ताल भी किया। दिनांक 5 सितंबर को प्रतिनिधिमंडल से मिलकर हमें आश्वासन दिया गया कि 7 सितंबर से केवाईसी और 2 अक्टूबर तक 522 प्रोग्रामरों की ज्वाइनिंग प्रक्रिया शुरू कर दी जाएगी। लेकिन अत्यंत खेद के साथ कहना पड़ रहा है कि आज तक हमारी ज्वाइनिंग प्रक्रिया शुरू नहीं की गई है।

लगातार आश्वासन मिलने के बावजूद ज्वाइनिंग नहीं होने के कारण हम सभी चयनित अभ्यर्थी  1 अक्टूबर से पुनः अनिश्चितकालीन शांतिपूर्ण धरना एवं भूख हड़ताल  पर हैं। आज हमारे आंदोलन एवं भूख हड़ताल का 7वाँ दिन है। इस भूख हड़ताल में हमारे साथी अंबुज कुमार, मिथलेश कुमार तथा हमारी दो महिला अभ्यर्थी निशा सहनी एवं चंदा कुमारी भी शामिल हैं।

हमारा उद्देश्य किसी प्रकार का विवाद या व्यवधान उत्पन्न करना नहीं है, बल्कि अपनी लंबित ज्वाइनिंग के लिए संबंधित विभाग का ध्यान आकृष्ट करना है। हम शांतिपूर्ण एवं लोकतांत्रिक तरीके से अपनी मांग सरकार एवं विभाग के समक्ष रख रहे हैं।

अतः माननीय मंत्री महोदय से हमारा  प्रमुख निवेदन एवं मांग  है कि  522 चयनित BELTRON प्रोग्रामरों की ज्वाइनिंग जल्द से जल्द सुनिश्चित कराने हेतु आवश्यक पहल एवं दिशा-निर्देश  प्रदान किए जाएँ।

हमें पूर्ण विश्वास है कि माननीय मंत्री महोदय हमारी समस्या को गंभीरता से लेते हुए  522 चयनित प्रोग्रामरों की लंबित ज्वाइनिंग शीघ्र कराने की दिशा में आवश्यक कार्रवाई  करेंगे।
